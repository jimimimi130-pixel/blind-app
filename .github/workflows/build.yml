name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:master
    steps:
      - uses: actions/checkout@v4
      - name: Fix buildozer.spec
        run: |
          python3 -c "
          import re
          t=open('buildozer.spec').read()
          def set_val(k,v):
              global t
              import re
              t=re.sub(r'^#?'+k+r'.*', k+' = '+v, t, flags=re.M)
              if k+' =' not in t:
                  t+='\n'+k+' = '+v+'\n'
          set_val('android.api','33')
          set_val('android.minapi','21')
          set_val('android.sdk','33')
          set_val('android.ndk','25b')
          set_val('android.accept_sdk_license','True')
          open('buildozer.spec','w').write(t)
          "
      - name: Build with Buildozer
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blind-apk
          path: bin/*.apk
